name: Build and Deploy Site

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege, scoped per job. The build job runs `npm ci` and `astro build`,
# which executes the code of several hundred transitive dependencies, so it gets
# read access and nothing else. Only the deploy job needs pages:write (to create
# a Pages deployment) and id-token:write (to request the OIDC JWT). Granting
# those at the top level, as the GitHub starter workflow does, would hand
# deployment-capable credentials to every third-party package the build runs.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - name: Validate catalog
        run: python tools/validate.py
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc }
      - name: Install site deps
        working-directory: site
        run: npm ci
      # Enforcing supply-chain gate. Verifies every installed package against the
      # registry's Sigstore signatures and, where published, its SLSA build
      # attestation. The lockfile's SRI digests only prove the bytes match what
      # was committed; they say nothing about who published them. Added after a
      # false-positive advisory (GHSA-hpcx-pg6g-x697) showed the repo had no
      # reproducible way to answer "is this artifact actually from its publisher".
      - name: Verify dependency provenance (enforcing)
        working-directory: site
        run: npm audit signatures
      - name: Build site
        working-directory: site
        run: npm run build
      # Link/route integrity (SITE-STANDARD 14.11), same guards the PR build runs,
      # so the artifact that actually deploys is checked too (a direct push to main
      # or a workflow_dispatch deploy does not go through the PR build). Run from the
      # repo root against the built dist.
      - name: Check rendered link resolution + anchors (enforcing)
        env:
          STRICT_ANCHORS: '1'
        run: node scripts/check-rendered-links.mjs site/dist
      - name: Check route parity (no published route removed without a redirect)
        run: node scripts/check-route-parity.mjs site/dist
      - uses: actions/upload-pages-artifact@v5
        with: { path: ./site/dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
